<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Showcase: widget</title>
<!-- One widget of tools/dev/showcase.html: the real page from ui/ (index, focus
     or player) on made-up data, with demo-wallpaper.svg behind the glass.
     ?w=today|upcoming|nodate|focus|player&x=<left>&y=<top>[&type=<text in the add field>] -->
<script type="module">
// A fixed moment (Wed 21 Oct 2026, 10:00 local), so the picture comes out the
// same whenever it's regenerated.
const now = new Date(2026, 9, 21, 10, 0).getTime();
const RealDate = Date;
window.Date = class extends RealDate {
  constructor(...args) { if (args.length) super(...args); else super(now); }
  static now() { return now; }
};
const q = new URLSearchParams(location.search);
const label = q.get('w') || 'today';
const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); };
let seq = 0;
const T = (title, due = null, time = null, repeat = null, extra = {}) =>
  ({ id: `d${++seq}`, title, due, time, repeat, done: false, doneAt: null, created: now - seq * 6e5, ...extra });
const tasks = [
  T('Созвон с командой', day(0), '11:00'),
  T('Отправить отчёт за неделю', day(0)),
  T('Позвонить в автосервис', day(0), '14:00'),
  T('Купить продукты на неделю', day(0)),
  T('Прогулка', day(0), '19:00', { kind: 'daily' }),
  T('Ответить на письма', day(0), null, null, { done: true, doneAt: now - 36e5 }),
  T('Оплатить интернет', day(-1)),
  T('Забрать посылку', day(1), '12:00'),
  T('Записаться к стоматологу', day(1)),
  T('Подготовить презентацию', day(2)),
  // ISO weekday numbers, as the store keeps them: 1 = Monday (26 Oct).
  T('Планёрка', day(5), '10:00', { kind: 'weekly', days: [1] }),
  T('Продлить подписку', day(6)),
  T('Посмотреть доклад https://example.com/talks/design-systems'),
  T('Разобрать фотографии'),
  T('Починить велосипед'),
];
const MIN = 60_000;
// Second pomodoro of the day, 11:24 left, rain playing.
const focus = {
  mode: 'pomodoro', phase: 'focus', running: true, endsAt: now + 11 * MIN + 24_000, remaining: 0,
  total: 25 * MIN, round: 1, day: day(0), today: 25 * MIN, sound: 'rain', volume: 0.6,
};
const cover = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92"><defs>' +
  '<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3a74"/>' +
  '<stop offset=".55" stop-color="#7a5f9e"/><stop offset="1" stop-color="#e79a86"/></linearGradient></defs>' +
  '<rect width="92" height="92" fill="url(#s)"/><circle cx="62" cy="36" r="10" fill="#ffe2c2"/>' +
  '<rect y="58" width="92" height="34" fill="#1c1a33" opacity=".7"/></svg>');
const media = {
  app: 'Spotify', title: 'Weightless', artist: 'Marconi Union', playing: true,
  position: 192_000, duration: 489_000, updated: now, cover, canPrev: true, canNext: true,
};
const backdrop = { monW: 1200, monH: 900, winX: +q.get('x') || 0, winY: +q.get('y') || 0, scale: 1, style: 'fill', ver: 1 };
const src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
Object.defineProperty(HTMLImageElement.prototype, 'src', {
  ...src,
  set(v) { src.set.call(this, String(v).startsWith('http://wall.localhost/') ? 'demo-wallpaper.svg' : v); },
});
const later = (fn) => new Promise((ok) => setTimeout(() => ok(fn()), 0));
window.__TAURI__ = {
  core: {
    invoke: (cmd) => later(() => ({
      get_tasks: structuredClone(tasks),
      get_backdrop: backdrop,
      hotkey_label: 'Alt+N',
      widgets_movable: false,
      focus_state: structuredClone(focus),
      focus_action: structuredClone(focus),
      focus_mode: structuredClone(focus),
      focus_prefs: structuredClone(focus),
      media_state: structuredClone(media),
    })[cmd] ?? null),
  },
  event: { listen: async () => () => {} },
  webviewWindow: {
    getCurrentWebviewWindow: () => ({ label, listen: async () => () => {}, setFocus: async () => {} }),
  },
};

// Load the real page: its stylesheets and markup, then its script.
const page = { focus: 'focus.html', player: 'player.html' }[label] ?? 'index.html';
const doc = new DOMParser().parseFromString(await (await fetch(`../../ui/${page}`)).text(), 'text/html');
for (const link of doc.querySelectorAll('link[rel=stylesheet]')) {
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = `../../ui/${link.getAttribute('href')}`;
  document.head.append(css);
}
document.body.innerHTML = doc.body.innerHTML;
await import(`../../ui/${doc.querySelector('script[type=module]').getAttribute('src')}`);

const typed = q.get('type');
if (typed) {
  setTimeout(() => {
    const input = document.getElementById('add-input');
    input.focus();
    input.value = typed;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }, 300);
}
</script>
</head>
<body></body>
</html>
