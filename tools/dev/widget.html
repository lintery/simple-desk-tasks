<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dev: widget</title>
<!-- Browser-only harness: fakes the Tauri backend so the widget UI can be clicked through.
     Serve the project root over http and open tools/dev/widget.html?w=today|upcoming|nodate -->
<link rel="stylesheet" href="../../ui/style.css">
<style>html,body{background:#2a0a16}.w{inset:20px auto auto 20px;width:340px;height:560px}</style>
<script>
(() => {
  const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); };
  const now = Date.now();
  let seq = 0;
  const T = (title, due = null, time = null, repeat = null, age = 0) =>
    ({ id: `m${++seq}`, title, due, time, repeat, done: false, doneAt: null, created: now - age * 864e5 - seq });
  const tasks = [
    T('Созвон с командой', day(0), '23:30'), T('Тренировка', day(0), '23:50', { kind: 'weekly', days: [1, 3, 5] }),
    T('Купить корм коту', day(0)), T('Оплатить коммуналку', day(-1)), T('Принять витамины', day(0), '00:01'),
    T('Заменить фильтр'), T('Выбрать подарок маме', null, null, null, 21),
    T('Купить цветы', day(1), '12:00'), T('Планёрка', day(3), '10:00', { kind: 'weekly', days: [1] }),
  ];
  const listeners = {};
  const emit = () => (listeners['tasks-changed'] || []).forEach((cb) => cb({ payload: structuredClone(tasks) }));
  const later = (fn) => new Promise((ok) => setTimeout(() => ok(fn()), 10));
  window.__mock = { tasks, log: [] };
  window.__TAURI__ = {
    core: {
      invoke: (cmd, a = {}) => later(() => {
        window.__mock.log.push([cmd, structuredClone(a)]);
        switch (cmd) {
          case 'get_tasks': return structuredClone(tasks);
          case 'add_task': { const t = T(a.title, a.due, a.due ? a.time : null, a.repeat); tasks.push(t); emit(); return t; }
          case 'update_task': {
            const t = tasks.find((x) => x.id === a.id);
            Object.assign(t, a.patch);
            if ('done' in a.patch) t.doneAt = a.patch.done ? Date.now() : null;
            if (!t.due) { t.time = null; t.repeat = null; }
            emit(); return null;
          }
          case 'delete_task': { const [t] = tasks.splice(tasks.findIndex((x) => x.id === a.id), 1); emit(); return structuredClone(t); }
          case 'restore_task': tasks.push(structuredClone(a.task)); emit(); return null;
          case 'get_backdrop': return null;
          case 'store_status': return window.__mock.storeError ?? null;
          case 'hotkey_label': return 'Ctrl+Alt+N';
          case 'widgets_movable': return false;
          case 'task_drag': (listeners['task-drag'] || []).forEach((cb) => cb({ payload: a.id })); return null;
          default: return null;
        }
      }),
    },
    event: { listen: async (ev, cb) => { (listeners[ev] ||= []).push(cb); return () => {}; } },
    webviewWindow: {
      getCurrentWebviewWindow: () => ({
        label: new URLSearchParams(location.search).get('w') || 'today',
        listen: async () => () => {},
        setFocus: async () => {},
      }),
    },
  };
})();
</script>
<script type="module" src="../../ui/app.js"></script>
</head>
<body>
<div class="w">
  <canvas class="wall"></canvas>
  <header class="hd" id="hd">
    <div class="ttl"><h2 id="title"></h2><span id="sub"></span></div>
    <div class="cnt" id="cnt"></div>
    <div class="prog" id="prog" hidden><i></i></div>
  </header>
  <div class="list" id="list"></div>
  <div class="snk" id="snk" hidden></div>
  <label class="add" id="add">
    <span class="plus"></span>
    <input id="add-input" autocomplete="off" spellcheck="false">
    <kbd id="add-kbd">N</kbd>
    <div class="parsed" id="parsed"></div>
  </label>
</div>
</body>
</html>
