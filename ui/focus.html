<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фокус</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="focus.css">
<script type="module" src="focus.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- controls, 16 grid -->
  <symbol id="play" viewBox="0 0 16 16"><path class="f" d="M5.2 3.6v8.8c0 .55.6.88 1.06.58l6.7-4.4a.7.7 0 0 0 0-1.16l-6.7-4.4A.69.69 0 0 0 5.2 3.6Z"/></symbol>
  <symbol id="pause" viewBox="0 0 16 16"><rect class="f" x="4.2" y="3.4" width="2.6" height="9.2" rx=".9"/><rect class="f" x="9.2" y="3.4" width="2.6" height="9.2" rx=".9"/></symbol>
  <symbol id="skip" viewBox="0 0 16 16"><path d="M3.8 4.3v7.4c0 .4.45.63.77.4l5.1-3.7a.5.5 0 0 0 0-.8l-5.1-3.7a.49.49 0 0 0-.77.4ZM12.2 3.8v8.4"/></symbol>
  <symbol id="reset" viewBox="0 0 16 16"><path d="M3.3 8.2A4.8 4.8 0 1 0 4.9 4.4M4.6 2.2v2.6h2.6"/></symbol>
  <symbol id="spk" viewBox="0 0 16 16"><path d="M2.8 6.2h2.1l3.2-2.6v8.8L4.9 9.8H2.8a.5.5 0 0 1-.5-.5V6.7a.5.5 0 0 1 .5-.5ZM10.6 6.1a2.7 2.7 0 0 1 0 3.8M12.4 4.3a5.2 5.2 0 0 1 0 7.4"/></symbol>
  <symbol id="spk-off" viewBox="0 0 16 16"><path d="M2.8 6.2h2.1l3.2-2.6v8.8L4.9 9.8H2.8a.5.5 0 0 1-.5-.5V6.7a.5.5 0 0 1 .5-.5ZM10.6 6.3l3.2 3.4M13.8 6.3l-3.2 3.4"/></symbol>
  <!-- sounds, 20 grid -->
  <symbol id="cloud" viewBox="0 0 20 20"><path d="M5.5 12h9.3a3.2 3.2 0 0 0 .4-6.38A5 5 0 0 0 5.6 6.4 2.8 2.8 0 0 0 5.5 12Z"/></symbol>
  <symbol id="s-rain-light" viewBox="0 0 20 20"><use href="#cloud"/><path d="M7.2 15.2v.1M12.4 15.6v.1M9.8 18.2v.1" stroke-width="1.9"/></symbol>
  <symbol id="s-rain" viewBox="0 0 20 20"><use href="#cloud"/><path d="M7.4 14.6l-.9 2.6M10.8 14.6l-.9 2.6M14.2 14.6l-.9 2.6"/></symbol>
  <symbol id="s-rain-heavy" viewBox="0 0 20 20"><use href="#cloud"/><path d="M6.2 14.4 4.8 18.4M9.2 14.4l-1.4 4M12.2 14.4l-1.4 4M15.2 14.4l-1.4 4"/></symbol>
  <symbol id="s-rain-wind" viewBox="0 0 20 20"><use href="#cloud"/><path d="M8.6 14.4l-2.4 2.2M12.6 14.4l-2.4 2.2M16.6 14.4l-2.4 2.2M2.5 18.6h6"/></symbol>
  <symbol id="s-rain-thunder" viewBox="0 0 20 20"><path d="M7.4 12H5.5a2.8 2.8 0 0 1 .1-5.6 5 5 0 0 1 9.6-.78A3.2 3.2 0 0 1 14.8 12h-2"/><path d="M11.1 8.6 8.6 13h3.2l-2.2 4.8"/></symbol>
  <symbol id="s-brown" viewBox="0 0 20 20"><path d="M1.6 10h1.6l1.2-3 1.5 7 1.7-10 1.8 12.2 1.8-13 1.7 11 1.6-8 1.4 5.2 1-2.4h1.5"/></symbol>
  <symbol id="s-waves" viewBox="0 0 20 20"><path d="M2 7.2c1.4 0 2.1-1.5 3.5-1.5S7.6 7.2 9 7.2s2.1-1.5 3.5-1.5 2.1 1.5 3.5 1.5 1.4-.7 2-1.1M2 11.6c1.4 0 2.1-1.5 3.5-1.5s2.1 1.5 3.5 1.5 2.1-1.5 3.5-1.5 2.1 1.5 3.5 1.5 1.4-.7 2-1.1M2 16c1.4 0 2.1-1.5 3.5-1.5S7.6 16 9 16s2.1-1.5 3.5-1.5S14.6 16 16 16s1.4-.7 2-1.1"/></symbol>
  <symbol id="s-fire" viewBox="0 0 20 20"><path d="M10 18.4c-3.5 0-6-2.4-6-5.6 0-2.8 1.8-4.3 3.1-6 1-1.3 1.5-2.8 1.4-4.6 2.8 1.4 4.6 4 4.5 7 .9-.45 1.6-1.3 1.8-2.3 1.5 1.4 2.4 3.6 2.4 5.9 0 3.2-2.5 5.6-5.7 5.6Z"/><path d="M10 18.4c-1.5 0-2.5-1-2.5-2.4 0-1.6 1.5-2.5 2.5-4.2 1 1.7 2.5 2.6 2.5 4.2 0 1.4-1 2.4-2.5 2.4Z"/></symbol>
</svg>
<div class="w fx is-idle" id="w">
  <canvas class="wall"></canvas>
  <div class="fx-dial">
    <svg class="fx-ring" viewBox="0 0 160 160">
      <circle class="trk" cx="80" cy="80" r="74"/>
      <circle class="tks" cx="80" cy="80" r="65"/>
      <circle class="arc" id="arc" cx="80" cy="80" r="74" stroke-dasharray="0 465"/>
      <g class="head-g" id="head"><circle class="halo" cx="80" cy="6" r="8"/><circle class="head" cx="80" cy="6" r="3.5"/></g>
    </svg>
    <div class="fx-in">
      <div class="fx-phase" id="phase"></div>
      <div class="fx-time" id="time"></div>
      <div class="fx-rounds" id="rounds"></div>
      <div class="fx-sub" id="sub"></div>
    </div>
  </div>
  <div class="fx-main">
    <div class="fx-hd"><h2>Фокус</h2><span id="today"></span></div>
    <div class="fx-modes" id="modes">
      <button class="mode" data-mode="pomodoro"><b>Помодоро</b><span>25 / 5</span></button>
      <button class="mode" data-mode="focus50"><b>Фокус</b><span>50 / 10</span></button>
      <button class="mode" data-mode="deep90"><b>Глубокий</b><span>90 / 20</span></button>
    </div>
    <div class="fx-ctl">
      <button class="play" id="go"><svg class="i"><use href="#play"/></svg></button>
      <button class="ib" id="skip" title="Следующая фаза"><svg class="i"><use href="#skip"/></svg></button>
      <button class="ib" id="reset" title="Сбросить"><svg class="i"><use href="#reset"/></svg></button>
      <div class="fx-next" id="next"></div>
    </div>
  </div>
  <div class="fx-sep"></div>
  <div class="fx-snd" id="snd">
    <div class="snd-hd">
      <b>Звуки</b>
      <div class="snd-now"><div class="wave still" id="wave"></div><span id="now"></span></div>
      <div class="vol">
        <button class="ib" id="mute"><svg class="i"><use href="#spk"/></svg></button>
        <div class="slider" id="slider"><i id="level"></i></div>
        <span class="vol-v" id="vol"></span>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>
</div>
</body>
</html>
