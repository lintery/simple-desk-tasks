  <symbol id="s-waves" viewBox="0 0 20 20"><path d="M2 7.2c1.4 0 2.1-1.5 3.5-1.5S7.6 7.2 9 7.2s2.1-1.5 3.5-1.5 2.1 1.5 3.5 1.5 1.4-.7 2-1.1M2 11.6c1.4 0 2.1-1.5 3.5-1.5s2.1 1.5 3.5 1.5 2.1-1.5 3.5-1.5 2.1 1.5 3.5 1.5 1.4-.7 2-1.1M2 16c1.4 0 2.1-1.5 3.5-1.5S7.6 16 9 16s2.1-1.5 3.5-1.5S14.6 16 16 16s1.4-.7 2-1.1"/></symbol>

  <symbol id="s-rain-roof" viewBox="0 0 20 20"><path d="M2.5 10 10 3.8l7.5 6.2M4.8 8.1V10M6.6 13.2l-.6 2M10.4 12.6l-.6 2M14.2 13.2l-.6 2M8.4 16.6l-.4 1.4M12.2 16.6l-.4 1.4"/></symbol>

<div class="w fx is-idle" id="w">
  <canvas class="wall"></canvas>
  <div class="fx-dial" id="dial">
    <svg class="fx-ring" viewBox="0 0 160 160">
      <circle class="trk" cx="80" cy="80" r="74"/>
      <circle class="tks" cx="80" cy="80" r="65"/>
      <circle class="arc" id="arc" cx="80" cy="80" r="74" stroke-dasharray="0 465"/>
      <g class="head-g" id="head"><circle class="halo" cx="80" cy="6" r="8"/><circle class="head" cx="80" cy="6" r="3.5"/></g>
    </svg>
    <div class="fx-in">
      <div class="fx-phase" id="phase"></div>
      <div class="fx-time" id="time"></div>
      <div class="fx-rounds" id="rounds"></div>
      <div class="fx-sub" id="sub"></div>
    </div>
  </div>
  <div class="fx-main">
    <div class="fx-hd"><h2>Фокус</h2>
      <span class="today" id="today-v"></span>
      <button class="stats-btn" id="today" title="Статистика за неделю"><svg class="i"><use href="#i-chart"/></svg>Статистика</button></div>
    <div class="fx-modes" id="modes">
      <button class="mode" data-mode="pomodoro"><b>Помодоро</b><span>25 / 5</span></button>
      <button class="mode" data-mode="focus50"><b>Фокус</b><span>50 / 10</span></button>
      <button class="mode" data-mode="deep90"><b>Глубокий</b><span>90 / 20</span></button>
    </div>
    <div class="fx-ctl">
      <button class="play" id="go"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="ib" id="skip" title="Следующая фаза"><svg class="i"><use href="#i-skip"/></svg></button>
      <button class="ib" id="reset" title="Сбросить"><svg class="i"><use href="#i-reset"/></svg></button>
      <div class="fx-next" id="next"></div>
    </div>
  </div>
  <div class="fx-sep"></div>
  <div class="fx-snd" id="snd">
    <div class="snd-hd">
      <b class="snd-title">Звуки</b>
      <button class="stats-back" id="stats-back" title="Вернуться к звукам"><svg class="i"><use href="#i-back"/></svg>Статистика за неделю</button>
      <div class="snd-now"><div class="wave still" id="wave"></div><span id="now"></span></div>
      <div class="vol">
        <button class="ib" id="mute"><svg class="i"><use href="#i-spk"/></svg></button>
        <div class="slider" id="slider"><i id="level"></i></div>
        <span class="vol-v" id="vol"></span>
      </div>
    </div>
    <div class="snd-body">
      <div class="groups" id="groups"></div>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>
</body>
</html>
