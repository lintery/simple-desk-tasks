<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Задачи</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="w">
  <canvas class="wall"></canvas>
  <header class="hd" id="hd">
    <div class="ttl"><h2 id="title"></h2><span id="sub"></span></div>
    <div class="cnt" id="cnt"></div>
    <div class="prog" id="prog" hidden><i></i></div>
  </header>
  <div class="list" id="list"></div>
  <div class="snk" id="snk" hidden></div>
  <label class="add" id="add">
    <span class="plus"></span>
    <input id="add-input" autocomplete="off" spellcheck="false">
    <button class="add-go" id="add-go" type="button" title="Добавить (Enter). Клавиша N — сразу к этому полю" aria-label="Добавить задачу"></button>
    <div class="parsed" id="parsed"></div>
  </label>
</div>
</body>
</html>
