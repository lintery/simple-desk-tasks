<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плеер</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
<script type="module" src="player.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 16 16"><path class="f" d="M5.2 3.6v8.8c0 .55.6.88 1.06.58l6.7-4.4a.7.7 0 0 0 0-1.16l-6.7-4.4A.69.69 0 0 0 5.2 3.6Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><rect class="f" x="4.2" y="3.4" width="2.6" height="9.2" rx=".9"/><rect class="f" x="9.2" y="3.4" width="2.6" height="9.2" rx=".9"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path class="f" d="M12.2 4.1v7.8a.6.6 0 0 1-.94.5L5.7 8.5a.6.6 0 0 1 0-1l5.56-3.9a.6.6 0 0 1 .94.5Z"/><rect class="f" x="3.4" y="3.6" width="1.7" height="8.8" rx=".85"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path class="f" d="M3.8 4.1v7.8c0 .48.55.77.94.5l5.56-3.9a.6.6 0 0 0 0-1L4.74 3.6a.6.6 0 0 0-.94.5Z"/><rect class="f" x="10.9" y="3.6" width="1.7" height="8.8" rx=".85"/></symbol>
  <symbol id="i-spotify" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M5 6.6c2-.6 4.3-.4 6.1.6M5.4 8.7c1.6-.45 3.3-.3 4.7.45M5.8 10.7c1.2-.3 2.4-.2 3.4.3"/></symbol>
  <symbol id="i-note" viewBox="0 0 16 16"><path d="M6.4 11.6V4.2l6-1.4v7.4"/><circle cx="4.9" cy="11.6" r="1.5"/><circle cx="10.9" cy="10.2" r="1.5"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 16 16"><path d="M2.5 4.8h2.2c1.3 0 2.4.7 3 1.8l1.6 2.8c.6 1.1 1.7 1.8 3 1.8h1.2M2.5 11.2h2.2c.9 0 1.7-.3 2.3-.9M9.6 5.7c.6-.6 1.4-.9 2.3-.9h1.6M12 3.2l1.6 1.6L12 6.4M12 9.6l1.6 1.6-1.6 1.6"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 16 16"><path d="M3 7.4V6.6a2 2 0 0 1 2-2h7.6M11 2.9l1.7 1.7L11 6.3M13 8.6v.8a2 2 0 0 1-2 2H3.4M5 13.1l-1.7-1.7L5 9.7"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 16 16"><path d="M3 7.4V6.6a2 2 0 0 1 2-2h7.6M11 2.9l1.7 1.7L11 6.3M13 8.6v.8a2 2 0 0 1-2 2H3.4M5 13.1l-1.7-1.7L5 9.7"/><path d="M7.4 7.2 8.3 6.6v3.2" stroke-width="1.2"/></symbol>
  <symbol id="i-spk" viewBox="0 0 16 16"><path d="M2.8 6.2h2.1l3.2-2.6v8.8L4.9 9.8H2.8a.5.5 0 0 1-.5-.5V6.7a.5.5 0 0 1 .5-.5ZM10.6 6.1a2.7 2.7 0 0 1 0 3.8M12.4 4.3a5.2 5.2 0 0 1 0 7.4"/></symbol>
  <symbol id="i-spk-off" viewBox="0 0 16 16"><path d="M2.8 6.2h2.1l3.2-2.6v8.8L4.9 9.8H2.8a.5.5 0 0 1-.5-.5V6.7a.5.5 0 0 1 .5-.5ZM10.6 6.3l3.2 3.4M13.8 6.3l-3.2 3.4"/></symbol>
</svg>
<div class="w pl paused" id="w">
  <canvas class="wall"></canvas>
  <div class="pl-art" id="art"><svg class="i"><use href="#i-note"/></svg><span class="pl-src" id="src"></span></div>
  <div class="pl-body">
    <div class="pl-top"><div class="pl-ttl" id="title"></div><div class="wave" id="wave"></div></div>
    <div class="pl-who">
      <span id="artist"></span>
      <button class="ib tog" id="shuffle" title="Перемешивание"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="ib tog" id="repeat" title="Повтор"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="pl-seek">
      <span class="pl-t" id="pos"></span>
      <div class="pl-bar" id="bar"><i id="fill"></i></div>
      <span class="pl-t" id="dur"></span>
    </div>
    <div class="pl-row">
      <div class="pl-ctl">
        <button class="ib" id="prev" title="Предыдущий"><svg class="i"><use href="#i-prev"/></svg></button>
        <button class="pl-pp" id="pp" title="Играть"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="ib" id="next" title="Следующий"><svg class="i"><use href="#i-next"/></svg></button>
      </div>
      <div class="pl-vol" id="vol">
        <button class="ib" id="mute" title="Выключить звук"><svg class="i"><use href="#i-spk"/></svg></button>
        <div class="slider" id="slider"><i id="level"></i></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
